name: Build and publish image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: edge
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Select image metadata
        id: image
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < DMPOD_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid DMPod version: $version" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "Git tag $tag does not match DMPOD_VERSION=$version" >&2
              exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag" >&2
            exit 1
          fi
          template_image="$(jq -r '.imageName' runpod/template.json.example)"
          if [[ "${template_image##*:}" != "v$version" ]]; then
            echo "Runpod template image must use tag v$version" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'nanogpt_revision=%s\n' "$(tr -d '[:space:]' < NANOGPT_REVISION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        name: Build and test image
        with:
          context: .
          platforms: linux/amd64
          target: test
          push: false
          build-args: |
            DMPOD_VERSION=${{ steps.image.outputs.version }}
            NANOGPT_REVISION=${{ steps.image.outputs.nanogpt_revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        name: Publish tested image
        with:
          context: .
          platforms: linux/amd64
          target: final
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dmpod-gpt:${{ steps.image.outputs.tag }}
          build-args: |
            DMPOD_VERSION=${{ steps.image.outputs.version }}
            NANOGPT_REVISION=${{ steps.image.outputs.nanogpt_revision }}
          cache-from: type=gha
